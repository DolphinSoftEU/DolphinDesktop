[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolphin-desktop"
version = "0.2.0"
description = "Windows desktop test automation for SAP, Qt, Electron, Java, Oracle Forms, and IBM mainframe — with lazy locators, auto-waiting, and pytest integration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "DolphinSoft Kamil Głuszek", email = "kontakt@dolphinsoft.pl" },
]
keywords = [
    "desktop-automation", "testing", "windows", "pytest", "uia",
    "sap", "qt", "electron", "cdp",
    "java-access-bridge", "oracle-forms",
    "mainframe", "tn3270", "tn5250", "as400", "ibm-i", "hllapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pywinauto>=0.6.8",
    "Pillow>=10.4",
    # Never imported by name. pywinauto's COM layer raises comtypes' COMError,
    # and _locator reads its ``hresult`` to tell "the pattern refused the call"
    # apart from "the pattern is missing". Declared so that behavioural
    # dependency survives pywinauto loosening its own requirement.
    "comtypes>=1.4",
    "pywin32>=306",
    "pyyaml>=6.0",
]

[project.scripts]
dolphin = "dolphin_desktop._cli:main"
dolphin-run = "dolphin_desktop._runner:main"

[project.urls]
Homepage = "https://dolphinsoft.pl"
Documentation = "https://dolphinsoft.pl"
Source = "https://github.com/DolphinSoftEU/DolphinDesktop"
Changelog = "https://github.com/DolphinSoftEU/DolphinDesktop/blob/master/CHANGELOG.md"
Issues = "https://github.com/DolphinSoftEU/DolphinDesktop/issues"

[project.entry-points."pytest11"]
# Entry-point name is 'dolphin-desktop' (not bare 'dolphin' or
# 'dolphinsoft') so it cannot collide with the pytest11 entry
# pytest-dolphinsoft registers under 'pytest_dolphinsoft.plugin'.
dolphin-desktop = "dolphin_desktop.pytest_plugin"

[project.entry-points."dolphin_desktop.backends"]
uia   = "dolphin_desktop._backend:UIABackend"
win32 = "dolphin_desktop._backend:Win32Backend"
qt    = "dolphin_desktop._backend:QtBackend"
image = "dolphin_desktop._backend:ImageBackend"
macos = "dolphin_desktop._backend:MacOSAccessibilityBackend"
linux = "dolphin_desktop._backend:LinuxATSPIBackend"
cdp   = "dolphin_desktop._backend:CDPBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/dolphin_desktop"]

[tool.hatch.build.targets.sdist]
# Deliberately no include/exclude. Hatchling then ships every file tracked by
# git, minus whatever .gitignore already rejects, which keeps the sdist
# complete by construction: docs arrive with mkdocs.yml, CONTRIBUTING.md with
# the pre-commit config it tells you to run, and a new top-level file needs no
# edit here to be packaged. The whitelist this replaces had silently dropped
# all four of those. Everything that must stay out belongs in .gitignore,
# where it also keeps the working tree clean.
#
# The wheel above stays narrow: only src/dolphin_desktop reaches site-packages.

[project.optional-dependencies]
# Stacks that need no wheel at all. They exist so the install command printed
# in each stack's guide resolves, instead of failing on an unknown extra.
sap = []            # SAP GUI Scripting is COM, published by SAP GUI itself
qt = []             # the Qt agent DLL ships inside this package
mainframe = []      # TN5250 is pure Python; ws3270 is an external binary
oracle-forms = []   # JAB ships with the Adoptium / Oracle JDK

# mss replaces PIL.ImageGrab for whole-virtual-desktop screenshots, which is
# markedly faster per trace step. It has nothing to do with MP4 encoding:
# that is an external ffmpeg binary driven through gdigrab, which pip cannot
# install — so there is deliberately no `video` extra to imply otherwise.
# See docs/tutorials/tracing.md.
fast = ["mss>=9.0"]
vision = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2.0",
]
telemetry = [
    "sentry-sdk>=2.0",
]
pytest = [
    "pytest>=8.3",
    "allure-pytest>=2.13",
]
cdp = [
    "playwright>=1.40",
]
# Composed from the other extras rather than restating their pins, so a
# version bump in one place cannot leave 'all' quietly behind.
# 'telemetry' is deliberately absent: it ships an SDK that reports off the
# machine, which is a decision to opt into by name, not to inherit from a
# convenience extra.
all = ["dolphin-desktop[cdp,fast,pytest,vision]"]

# No `dev` extra: the development toolchain lives in [dependency-groups] below,
# which is what CONTRIBUTING.md and CI both use (`uv sync --group dev`). A
# second copy here was referenced by nothing and had already fallen behind by
# two packages.

[dependency-groups]
dev = [
    "build>=1.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
    "twine>=6.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "N818",
    # Prose in docstrings, comments and user-facing strings uses typographic
    # punctuation on purpose (em/en dashes, ×, →). These rules flag every one
    # of them as a possible homoglyph typo.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["dolphin_desktop"]

[tool.ruff.lint.per-file-ignores]
# Long lines are embedded HTML/CSS in the trace-report template.
"src/dolphin_desktop/_trace.py" = ["E501"]
# `_AA_TO_DO` mirrors the Java Access Bridge `AccessibleActionsToDo` struct.
"src/dolphin_desktop/_java.py" = ["N801"]
# `WM_KEYDOWN` / `WM_KEYUP` are Win32 constant names, copied verbatim.
"src/dolphin_desktop/_oracle_forms.py" = ["N806"]
# Test names embed EHLLAPI function names (ConnectPS, SENDKEY) so a failure
# points straight at the call it exercises.
"tests/mainframe/hllapi_mock/test_hllapi_unit.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^examples/"]

# These are the checks ``strict = true`` would switch on that this codebase
# actually satisfies, listed one by one instead. The previous config set
# ``strict`` and then disabled the other six through per-module overrides, so
# it read as far more rigorous than it was. Turning the full set on today
# reports 220 errors across 27 files — worth doing, but as its own piece of
# work, not folded into a release.
check_untyped_defs = true
disallow_subclassing_any = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring a real app process",
    "dolphin_headless: marks tests that require headless desktop mode",
    "dolphin(timeout): overrides Dolphin runtime options for a test",
    "qt_agent: Qt agent DLL injection tests",
    "qt_qml: QML scene-graph introspection tests (Qt agent)",
    "qt_graphics: QGraphicsView walker tests (Qt agent)",
    "qt_charts: Qt Charts polymorphic introspection tests (Qt agent)",
]

[tool.coverage.run]
source_pkgs = ["dolphin_desktop"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
omit = [
    "*/tests/*",
]
