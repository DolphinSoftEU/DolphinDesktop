[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolphin-desktop"
version = "0.2.0.dev3"
description = "Windows desktop test automation for SAP, Qt, Electron, Java, Oracle Forms, and IBM mainframe — with lazy locators, auto-waiting, and pytest integration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "DolphinSoft Kamil Głuszek", email = "kontakt@dolphinsoft.pl" },
    { name = "DolphinSoft Łukasz Dębski", email = "kontakt@dolphinsoft.pl" },
]
keywords = [
    "desktop-automation", "testing", "windows", "pytest", "uia",
    "sap", "qt", "electron", "cdp",
    "java-access-bridge", "oracle-forms",
    "mainframe", "tn3270", "tn5250", "as400", "ibm-i", "hllapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pywinauto>=0.6.8",
    "Pillow>=10.4",
    "comtypes>=1.4",
    "pywin32>=306",
    "pyyaml>=6.0",
]

[project.scripts]
dolphin = "dolphin_desktop._cli:main"
dolphin-run = "dolphin_desktop._runner:main"

[project.urls]
Homepage = "https://dolphinsoft.pl"
Documentation = "https://dolphinsoft.pl"
Source = "https://github.com/DolphinSoftEU/DolphinDesktop"
Changelog = "https://github.com/DolphinSoftEU/DolphinDesktop/blob/master/CHANGELOG.md"
Issues = "https://github.com/DolphinSoftEU/DolphinDesktop/issues"
Security = "https://github.com/DolphinSoftEU/DolphinDesktop/blob/master/SECURITY.md"

[project.entry-points."pytest11"]
dolphin-desktop = "dolphin_desktop.pytest_plugin"

[project.entry-points."dolphin_desktop.backends"]
uia   = "dolphin_desktop._backend:UIABackend"
win32 = "dolphin_desktop._backend:Win32Backend"
qt    = "dolphin_desktop._backend:QtBackend"
image = "dolphin_desktop._backend:ImageBackend"
macos = "dolphin_desktop._backend:MacOSAccessibilityBackend"
linux = "dolphin_desktop._backend:LinuxATSPIBackend"
cdp   = "dolphin_desktop._backend:CDPBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/dolphin_desktop"]

[project.optional-dependencies]
fast = ["mss>=9.0"]
vision = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2.0",
]
telemetry = [
    "sentry-sdk>=2.0",
]
pytest = [
    "pytest>=8.3",
    "allure-pytest>=2.13",
]
cdp = [
    "playwright>=1.40",
]
all = ["dolphin-desktop[cdp,fast,pytest,vision]"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
    "twine>=6.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "N818",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["dolphin_desktop"]

[tool.ruff.lint.per-file-ignores]
"src/dolphin_desktop/_trace.py" = ["E501"]
"src/dolphin_desktop/_java.py" = ["N801"]
"src/dolphin_desktop/_oracle_forms.py" = ["N806"]
"tests/mainframe/hllapi_mock/test_hllapi_unit.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^examples/"]

check_untyped_defs = true
disallow_subclassing_any = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring a real app process",
    "dolphin_headless: marks tests that require headless desktop mode",
    "dolphin(timeout): overrides Dolphin runtime options for a test",
    "qt_agent: Qt agent DLL injection tests",
    "qt_qml: QML scene-graph introspection tests (Qt agent)",
    "qt_graphics: QGraphicsView walker tests (Qt agent)",
    "qt_charts: Qt Charts polymorphic introspection tests (Qt agent)",
]

[tool.coverage.run]
source_pkgs = ["dolphin_desktop"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
omit = [
    "*/tests/*",
]
