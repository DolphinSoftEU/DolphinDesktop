[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolphin-desktop"
version = "0.2.0"
description = "Windows desktop test automation for SAP, Qt, Electron, Java, Oracle Forms, and IBM mainframe — with lazy locators, auto-waiting, and pytest integration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "DolphinSoft Kamil Głuszek", email = "kontakt@dolphinsoft.pl" },
]
keywords = [
    "desktop-automation", "testing", "windows", "pytest", "uia",
    "sap", "qt", "electron", "cdp",
    "java-access-bridge", "oracle-forms",
    "mainframe", "tn3270", "tn5250", "as400", "ibm-i", "hllapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pywinauto>=0.6.8",
    "Pillow>=10.4",
    "comtypes>=1.4",
    "pywin32>=306",
    "pyyaml>=6.0",
]

[project.scripts]
dolphin = "dolphin_desktop._cli:main"
dolphin-run = "dolphin_desktop._runner:main"

[project.urls]
Homepage = "https://dolphinsoft.pl"
Documentation = "https://dolphinsoft.pl"
Source = "https://github.com/DolphinSoftEU/DolphinDesktop"

[project.entry-points."pytest11"]
# Entry-point name is 'dolphin-desktop' (not bare 'dolphin' or
# 'dolphinsoft') so it cannot collide with the pytest11 entry
# pytest-dolphinsoft registers under 'pytest_dolphinsoft.plugin'.
dolphin-desktop = "dolphin_desktop.pytest_plugin"

[project.entry-points."dolphin_desktop.backends"]
uia   = "dolphin_desktop._backend:UIABackend"
win32 = "dolphin_desktop._backend:Win32Backend"
qt    = "dolphin_desktop._backend:QtBackend"
image = "dolphin_desktop._backend:ImageBackend"
macos = "dolphin_desktop._backend:MacOSAccessibilityBackend"
linux = "dolphin_desktop._backend:LinuxATSPIBackend"
cdp   = "dolphin_desktop._backend:CDPBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/dolphin_desktop"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dolphin_desktop",
    "docs",
    "tests",
    "/README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "RELEASING.md",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/*.pyc",
    "5.15.2",
    ".venv*",
    "aqtinstall.log",
    "*.xml",
    "Zrzut ekranu*",
]

[project.optional-dependencies]
# Every stack that needs an extra dependency lives here so a random
# user can `pip install "dolphin-desktop[stack]"` and be ready.
sap = []            # placeholder — SAP scripting is COM-based, no wheel
qt = []             # placeholder — Qt agent DLL is bundled, not pip-installed
mainframe = []      # placeholder — TN5250 is pure Python; ws3270 is out-of-band
oracle-forms = []   # placeholder — JAB is bundled with Adoptium/Oracle JDKs
fast = [
    "mss>=9.0",
]
video = [
    "mss>=9.0",
]
vision = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2.0",
]
telemetry = [
    "sentry-sdk>=2.0",
]
pytest = [
    "pytest>=8.3",
    "allure-pytest>=2.13",
]
cdp = [
    "playwright>=1.40",
]
all = [
    "playwright>=1.40",
    "mss>=9.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
    "twine>=6.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "N818",
    # Prose in docstrings, comments and user-facing strings uses typographic
    # punctuation on purpose (em/en dashes, ×, →). These rules flag every one
    # of them as a possible homoglyph typo.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["dolphin_desktop"]

[tool.ruff.lint.per-file-ignores]
# Long lines are embedded HTML/CSS in the trace-report template.
"src/dolphin_desktop/_trace.py" = ["E501"]
# `_AA_TO_DO` mirrors the Java Access Bridge `AccessibleActionsToDo` struct.
"src/dolphin_desktop/_java.py" = ["N801"]
# `WM_KEYDOWN` / `WM_KEYUP` are Win32 constant names, copied verbatim.
"src/dolphin_desktop/_oracle_forms.py" = ["N806"]
# Test names embed EHLLAPI function names (ConnectPS, SENDKEY) so a failure
# points straight at the call it exercises.
"tests/mainframe/hllapi_mock/test_hllapi_unit.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["^examples/"]

[[tool.mypy.overrides]]
module = ["dolphin_desktop.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring a real app process",
    "dolphin_headless: marks tests that require headless desktop mode",
    "dolphin(timeout): overrides Dolphin runtime options for a test",
    "qt_agent: Qt agent DLL injection tests",
    "qt_qml: QML scene-graph introspection tests (Qt agent)",
    "qt_graphics: QGraphicsView walker tests (Qt agent)",
    "qt_charts: Qt Charts polymorphic introspection tests (Qt agent)",
]

[tool.coverage.run]
source_pkgs = ["dolphin_desktop"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
omit = [
    "*/tests/*",
]
