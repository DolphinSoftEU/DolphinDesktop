name: CI

on:
  push:
    branches: [master, testpypi-preview]
  pull_request:
    branches: [master, testpypi-preview]

# Least privilege: the whole workflow only reads the repository. No job here
# writes contents, and none needs an OIDC token — those are granted per job
# in release.yml, and only to the jobs that publish.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: "Unit / Python ${{ matrix.python-version }} / Windows"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Check lockfile
        # A lockfile that does not match pyproject fails the build here rather
        # than letting an inconsistent dependency set install.
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --group dev --extra vision

      - name: Check workflow security policy
        run: uv run --locked pytest tests/framework/test_ci_security.py -q

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy src/

      - name: Unit tests
        run: >
          uv run --locked pytest
          -m unit
          --cov=dolphin_desktop
          --cov-report=xml
          --cov-report=term-missing
          -q

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: always()
        with:
          files: coverage.xml
          flags: windows-py${{ matrix.python-version }}
          fail_ci_if_error: false

  package-linux:
    name: "Linux package install and import"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Install locked build tools
        run: uv sync --locked --only-group build

      - name: Build wheel
        run: uv run --no-sync python -m build --no-isolation --wheel

      - name: Install wheel and verify Windows-only dependencies stay absent
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/dolphin-smoke"
          "$RUNNER_TEMP/dolphin-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/dolphin-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import warnings

          installed = {
              distribution.metadata["Name"].lower()
              for distribution in importlib.metadata.distributions()
          }
          assert "pywin32" not in installed
          assert "comtypes" not in installed

          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              import dolphin_desktop

          assert any(
              warning.category is RuntimeWarning
              and "designed for Windows" in str(warning.message)
              for warning in caught
          )
          print("Linux wheel import succeeded without Windows-only dependencies")
          PY

  component-windows:
    name: "Windows component tests"
    runs-on: windows-latest
    needs: unit
    env:
      DOLPHIN_COMPONENT_PREFLIGHT: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --extra vision --extra cdp

      - name: Install Chromium for CDP endpoint identity regression
        run: uv run --no-sync python -m playwright install chromium

      - name: Install wc3270
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wc3270-4.5ga6-noinstall-64.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP "wc3270"
          Invoke-WebRequest `
            -Uri "https://x3270.bgp.nu/download/04.05/wc3270-4.5ga6-noinstall-64.zip" `
            -OutFile $archive
          $expectedHash = "EB3A7A6AACAA769F00676CA56A5F1718B9068F359A96BDF26477499E4AED7468"
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actualHash -ne $expectedHash) {
            throw "wc3270 archive SHA256 mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot -Force
          $ws3270 = Get-ChildItem -LiteralPath $installRoot -Recurse -Filter "ws3270.exe" |
            Select-Object -First 1
          if ($null -eq $ws3270) {
            throw "wc3270 archive did not contain ws3270.exe"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "DOLPHIN_WS3270_PATH=$($ws3270.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $ws3270.DirectoryName

      - name: Verify wc3270
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:DOLPHIN_WS3270_PATH)) {
            throw "DOLPHIN_WS3270_PATH does not point to ws3270.exe"
          }
          Get-Item -LiteralPath $env:DOLPHIN_WS3270_PATH | Format-List FullName,Length

      - name: Component tests
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "component-results.xml"
          uv run --locked pytest -m "(component or windows_component) and not qt_agent" -q --junitxml $report
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          [xml]$results = Get-Content -Raw -LiteralPath $report
          $cdp = $results.SelectNodes("//testcase[@name='test_parallel_sessions_keep_real_target_and_profile_isolation']")
          if ($cdp.Count -ne 1 -or $cdp[0].SelectNodes("skipped|failure|error").Count -ne 0) {
            throw "KAN-475 requires a passing real Chromium handshake and profile-isolation regression"
          }

      - name: Install Qt agent test bindings
        run: uv sync --locked --group dev --group qt-tests --extra vision

      - name: Verify Qt agent test bindings
        run: uv run --no-sync python -c "import PyQt5, PySide6"

      - name: Qt agent integration and security tests
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "qt-agent-results.xml"
          uv run --no-sync pytest tests/qt/test_qt_agent_v2.py -m qt_agent -q --junitxml $report
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          [xml]$results = Get-Content -Raw -LiteralPath $report
          $cases = $results.SelectNodes("//testcase")
          $expected = @(
            "test_authenticated_agent_attach_auth_and_stop_restart[qt5]",
            "test_authenticated_agent_attach_auth_and_stop_restart[qt6]",
            "test_native_object_lifetime_overloads_and_bounded_stop[qt5]",
            "test_native_object_lifetime_overloads_and_bounded_stop[qt6]",
            "test_agent_pipe_security_boundaries[qt5]",
            "test_agent_pipe_security_boundaries[qt6]"
          )
          $actual = @{}
          foreach ($case in $cases) {
            $actual[$case.GetAttribute("name")] = $true
          }
          foreach ($name in $expected) {
            if (-not $actual.ContainsKey($name)) {
              throw "Required Qt agent scenario did not run: $name"
            }
          }
          $skipped = $results.SelectNodes("//testcase/skipped")
          if ($skipped.Count -ne 0) {
            throw "Qt agent integration scenarios may not be skipped (found $($skipped.Count))"
          }

  package:
    name: Build package
    runs-on: windows-latest
    needs: unit

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Install locked build tools
        run: uv sync --locked --only-group build

      - name: Build wheel and sdist
        run: uv run --no-sync python -m build --no-isolation

      - name: Check distribution metadata
        run: uv run --no-sync twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dolphin-desktop-dist
          path: dist/
          if-no-files-found: error

  security:
    name: "Security gate (CVE / secrets / SAST) / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Install locked security tools
        run: uv sync --locked --only-group security

      - name: Dependency audit (CVE)
        shell: bash
        run: |
          uv export --locked --no-hashes --format requirements-txt --all-extras --all-groups \
            --no-emit-project > requirements.audit.txt
          uv run --no-sync pip-audit -r requirements.audit.txt --no-deps --disable-pip --strict

      - name: Static analysis (SAST)
        run: uv run --no-sync bandit -r src/dolphin_desktop -ll

      - name: Secret scan
        run: uv run --no-sync python .github/scripts/scan_secrets.py
