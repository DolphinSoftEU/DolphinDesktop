name: Docs

on:
  push:
    branches: [master, testpypi-preview]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/dolphin_desktop/**"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/dolphin_desktop/**"

# Default to read-only. Only the Pages deploy job needs to write (mike
# pushes the built site to the gh-pages branch), so contents: write is
# granted there and nowhere else.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NO_MKDOCS_2_WARNING: 1

jobs:
  build:
    name: Build docs
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # needed for mike versioning

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: site/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # The only writer in this workflow: mike commits the built site to gh-pages.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy with mike
        run: |
          mike deploy --push --update-aliases latest
          mike set-default --push latest
