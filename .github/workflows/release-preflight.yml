name: Release preflight

# First deploy this workflow and its script dependencies to the default branch
# (master) through a reviewed PR before hosted dispatch acceptance tests.
# A preview-only merge is insufficient. See RELEASING.md, First deployment.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Policy to audit (never publishes)
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

jobs:
  release-preflight:
    name: release-preflight (no publication)
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate release target
        id: meta
        env:
          EVENT_NAME: ${{ startsWith(github.ref, 'refs/tags/') && 'push' || 'workflow_dispatch' }}
          RELEASE_REF: ${{ github.ref }}
          DISPATCH_TARGET: ${{ inputs.target }}
        run: python .github/scripts/validate_release.py

      - name: Audit native release policies
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TARGET: ${{ steps.meta.outputs.target }}
        run: python .github/scripts/release_preflight.py

      - name: Validate exact CI SHA and artifact provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TARGET: ${{ steps.meta.outputs.target }}
          EVENT_NAME: ${{ startsWith(github.ref, 'refs/tags/') && 'push' || 'workflow_dispatch' }}
        run: python .github/scripts/release_provenance.py

      - name: Download CI artifact and verify archive digest
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARTIFACT_ID: ${{ steps.provenance.outputs.artifact_id }}
          CI_ARTIFACT_DIGEST: ${{ steps.provenance.outputs.artifact_digest }}
        run: python .github/scripts/download_ci_artifact.py

      - name: Verify distributions and CI identity
        id: hashes
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ steps.provenance.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.provenance.outputs.ci_run_attempt }}
        run: python .github/scripts/distribution_manifest.py verify

      - name: Determine exact CI artifact version
        id: version
        env:
          CI_RUN_ID: ${{ steps.provenance.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.provenance.outputs.ci_run_attempt }}
        run: python .github/scripts/preview_version.py expected

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Export locked runtime dependencies
        run: >-
          uv export --locked --no-default-groups --no-emit-project
          --format requirements-txt --output-file "${{ runner.temp }}/release-requirements.txt"

      - name: Smoke verified CI wheel (no publication)
        run: >-
          python .github/scripts/smoke_wheel.py
          --wheel-directory release-artifact/dist
          --requirements "${{ runner.temp }}/release-requirements.txt"
          --expected-version "${{ steps.version.outputs.version }}"
