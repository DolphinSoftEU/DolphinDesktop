name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Publish target
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
  push:
    tags:
      - "v*.*.*"

# Default to read-only for every job. The OIDC token used by Trusted
# Publishing (id-token: write) is granted per job, only to the two jobs that
# actually publish — build and the smoke tests never receive it.
permissions:
  contents: read

jobs:
  security:
    name: "Security gate (CVE / secrets / SAST) / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Install locked security tools
        run: uv sync --locked --only-group security

      - name: Dependency audit (CVE)
        shell: bash
        run: |
          uv export --locked --no-hashes --format requirements-txt --all-extras --all-groups \
            --no-emit-project > requirements.audit.txt
          uv run --no-sync pip-audit -r requirements.audit.txt --no-deps --disable-pip --strict

      - name: Static analysis (SAST)
        run: uv run --no-sync bandit -r src/dolphin_desktop -ll

      - name: Secret scan
        run: uv run --no-sync python .github/scripts/scan_secrets.py

  build:
    name: Prepare verified CI distributions
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      target: ${{ steps.meta.outputs.target }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      ci_run_id: ${{ steps.provenance.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.provenance.outputs.ci_run_attempt }}
      manifest_sha256: ${{ steps.hashes.outputs.manifest_sha256 }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate release target
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          DISPATCH_TARGET: ${{ inputs.target }}
        run: python .github/scripts/validate_release.py

      - name: Validate protected source, exact CI SHA and environments
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TARGET: ${{ steps.meta.outputs.target }}
          RULESETS_ATTESTATION: ${{ vars.RELEASE_RULESETS_ATTESTATION }}
        run: python .github/scripts/release_provenance.py

      - name: Download CI artifact and verify archive digest
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARTIFACT_ID: ${{ steps.provenance.outputs.artifact_id }}
          CI_ARTIFACT_DIGEST: ${{ steps.provenance.outputs.artifact_digest }}
        run: python .github/scripts/download_ci_artifact.py

      - name: Verify distributions and CI identity
        id: hashes
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ steps.provenance.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.provenance.outputs.ci_run_attempt }}
        run: python .github/scripts/distribution_manifest.py verify

      - name: Determine exact CI artifact version
        id: version
        env:
          CI_RUN_ID: ${{ steps.provenance.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.provenance.outputs.ci_run_attempt }}
        run: python .github/scripts/preview_version.py expected

      - name: Upload distributions
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dolphin-desktop-dist-attempt-${{ github.run_attempt }}
          path: release-artifact/
          if-no-files-found: error

  smoke-local:
    name: Smoke exact wheel before publication
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact/
          merge-multiple: true

      - name: Verify distributions before local smoke
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ needs.build.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.build.outputs.ci_run_attempt }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: python .github/scripts/distribution_manifest.py verify

      - name: Export locked runtime dependencies
        run: >-
          uv export --locked --no-default-groups --no-emit-project
          --format requirements-txt --output-file "${{ runner.temp }}/release-requirements.txt"

      - name: Import and CLI smoke on the exact local wheel
        run: >-
          python .github/scripts/smoke_wheel.py
          --wheel-directory release-artifact/dist
          --requirements "${{ runner.temp }}/release-requirements.txt"
          --expected-version "${{ needs.build.outputs.version }}"

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, smoke-local]
    if: needs.build.outputs.target == 'testpypi'
    environment: testpypi
    # OIDC token for PyPI Trusted Publishing — only this publishing job.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact/
          merge-multiple: true

      - name: Verify approved distributions immediately before upload
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ needs.build.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.build.outputs.ci_run_attempt }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: python .github/scripts/distribution_manifest.py verify

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release-artifact/dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, smoke-local]
    if: needs.build.outputs.target == 'pypi'
    environment: pypi
    # OIDC token for PyPI Trusted Publishing — only this publishing job.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact/
          merge-multiple: true

      - name: Verify approved distributions immediately before upload
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ needs.build.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.build.outputs.ci_run_attempt }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: python .github/scripts/distribution_manifest.py verify

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifact/dist/

  smoke-testpypi:
    name: Smoke TestPyPI package
    runs-on: windows-latest
    needs: [build, publish-testpypi]
    if: needs.build.outputs.target == 'testpypi'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact/
          merge-multiple: true

      # --pre because a preview may carry a PEP 440 pre-release segment
      # (0.2.0.dev1), which pip otherwise filters out of the candidate list.
      # The retry is for index propagation: the upload above completes before
      # test.pypi.org/simple/ serves the new file, so the first attempt can
      # legitimately report "No matching distribution found".
      #
      # --no-deps, single --index-url (no --extra-index-url): this step must
      # fetch ONLY the dolphin-desktop artifact itself from TestPyPI. Mixing
      # both indexes lets pip consider competing candidates from either index.
      # Dependencies are installed separately from PyPI with lockfile hashes.
      - name: Download dolphin-desktop from TestPyPI
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          # Printed because a Requires-Python mismatch and a missing upload
          # fail identically -- pip just says "no matching distribution". The
          # interpreter and the index listing tell the two apart at a glance.
          python --version
          python -m pip --version
          Write-Host "--- what the index offers ---"
          python -m pip index versions dolphin-desktop --pre --index-url https://test.pypi.org/simple/
          New-Item -ItemType Directory -Force -Path testpypi-download | Out-Null
          for ($i = 1; $i -le 6; $i++) {
            python -m pip download --pre --no-deps --only-binary=:all: `
              --index-url https://test.pypi.org/simple/ `
              --dest testpypi-download `
              "dolphin-desktop==$version"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "attempt $i failed; the index may not have caught up yet, retrying in 20s"
            Start-Sleep -Seconds 20
          }
          Write-Error "dolphin-desktop==$version did not become downloadable from TestPyPI"
          exit 1

      # The published artifact must be byte-identical to what this workflow
      # run built and audited above — not a same-version file uploaded by
      # someone/something else in the window between build and this check.
      - name: Verify the TestPyPI wheel matches this run's build artifact
        shell: pwsh
        run: |
          $built = Get-ChildItem release-artifact/dist -Filter *.whl | Select-Object -First 1
          $downloaded = Get-ChildItem testpypi-download -Filter *.whl | Select-Object -First 1
          $builtHash = (Get-FileHash $built.FullName -Algorithm SHA256).Hash
          $downloadedHash = (Get-FileHash $downloaded.FullName -Algorithm SHA256).Hash
          Write-Host "build artifact: $($built.Name) $builtHash"
          Write-Host "TestPyPI:       $($downloaded.Name) $downloadedHash"
          if ($builtHash -ne $downloadedHash) {
            Write-Error "TestPyPI wheel does not match the artifact built in this workflow run"
            exit 1
          }

      - name: Export locked runtime dependencies
        run: >-
          uv export --locked --no-default-groups --no-emit-project
          --format requirements-txt --output-file "${{ runner.temp }}/release-requirements.txt"

      - name: Import and CLI smoke
        run: >-
          python .github/scripts/smoke_wheel.py
          --wheel-directory testpypi-download
          --requirements "${{ runner.temp }}/release-requirements.txt"
          --expected-version "${{ needs.build.outputs.version }}"

  smoke-pypi:
    name: Smoke PyPI package
    runs-on: windows-latest
    needs: [build, publish-pypi]
    if: needs.build.outputs.target == 'pypi'

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # Retried for the same reason as the TestPyPI smoke: the publish step
      # returns before the index serves the new file. No --pre here; a
      # production release is a final version and should resolve as one.
      - name: Install from PyPI
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          for ($i = 1; $i -le 6; $i++) {
            python -m pip install "dolphin-desktop==$version"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "attempt $i failed; the index may not have caught up yet, retrying in 20s"
            Start-Sleep -Seconds 20
          }
          Write-Error "dolphin-desktop==$version did not become installable from PyPI"
          exit 1

      - name: Import and CLI smoke
        run: |
          python -c "import dolphin_desktop; print(dolphin_desktop.__version__)"
          dolphin --help
          dolphin info backends
